[project]
name = "study-agent"
version = "0.2.0"
description = "Study/work agent: RAG, knowledge graph, OpenAI-compatible LLM, docx/pdf export, sandbox, web UI."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.9.0,<3.0.0",
  "python-dotenv>=1.0.1,<2.0.0",
  "pypdf>=5.1.0,<6.0.0",
  "networkx>=3.4,<4.0.0",
  "python-docx>=1.1.2,<2.0.0",
  "reportlab>=4.2.5,<5.0.0",
  "python-pptx>=1.0.0,<2.0.0",
  "Pillow>=10.0.0,<12.0.0",
  "matplotlib>=3.8.0,<4.0.0",
  "numpy>=1.26.0,<3.0.0",
  "docker>=7.1.0,<8.0.0",
  "typing-extensions>=4.12.2,<5.0.0",
  "fastapi>=0.115.0,<1.0.0",
  "uvicorn>=0.32.0,<1.0.0",
  "python-multipart>=0.0.12,<1.0.0",
  "httpx>=0.27.0,<1.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0,<9.0.0",
  "ruff>=0.8.0,<1.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
