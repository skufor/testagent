name: ci

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt
      - name: Ruff
        run: ruff check src config.py server_core.py tests
      - name: Pytest
        run: pytest -q tests/ --ignore=tests/test_sandbox.py
        env:
          STUDY_AGENT_SKIP_LIVE: "1"
          ALLOWED_ORIGINS: "http://localhost:5173"
          API_KEY: "test-key"
          LLM_API_KEY: "test"
          LLM_BASE_URL: "https://example.invalid/v1"
          LLM_MODEL: "test"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
